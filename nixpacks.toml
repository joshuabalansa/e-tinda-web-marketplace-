[phases.install]
cmds = [
    "composer install --no-dev --optimize-autoloader"
]

[phases.build]
cmds = [
    "echo 'Skipping frontend build - using Laravel without Vite'",
    "mkdir -p storage/app/public/products",
    "mkdir -p storage/app/public/forums/videos",
    "mkdir -p storage/app/public/forums/videos/replies",
    "chmod -R 775 storage",
    "echo 'Storage files will be served via route - no symlink needed'",
    "php artisan route:clear || true",
    "php artisan config:clear || true"
]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=8080"
